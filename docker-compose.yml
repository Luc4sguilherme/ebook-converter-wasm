services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
      target: final-build
      args:
        SINGLE_FILE: ${SINGLE_FILE:-1}
    volumes:
      - ./dist:/dist-output
      - ./src/js:/build/src/js:ro
    entrypoint: ["/bin/sh", "-c", "cp -r /build/dist/node /dist-output/ 2>/dev/null; cp -r /build/dist/browser /dist-output/ 2>/dev/null; chown -R 1000:1000 /dist-output; echo 'Artifacts copied to dist/ (node/ + browser/)'"]
